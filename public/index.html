<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Palace – Pictionary, Uno &amp; Ludo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#2b2350;--mut:#7a7399;--red:#ff5c6c;--yel:#ffc928;--grn:#2ecc8f;--blu:#4c8dff;--pur:#8a5cff;--line:#2b2350;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1838;--card:#2a2354;--ink:#fff4e0;--mut:#b3aad8;--line:#0d0a20}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,'Segoe UI',sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:.2em 0;text-align:center;letter-spacing:.5px}
h1 span:nth-child(3n+1){color:var(--red)}h1 span:nth-child(3n+2){color:var(--blu)}h1 span:nth-child(3n){color:var(--grn)}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:16px}
.btn{border:3px solid var(--line);background:var(--yel);border-radius:16px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--line);color:#2b2350}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.g{background:var(--grn)}.btn.b{background:var(--blu);color:#fff}.btn.r{background:var(--red);color:#fff}.btn.s{padding:6px 12px;font-size:.9rem}
input{border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--bg);width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.av{font-size:1.8rem;width:50px;height:50px;border-radius:50%;border:3px solid var(--line);background:var(--bg);cursor:pointer}
.av.on{background:var(--yel);transform:scale(1.12)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0}
.game{cursor:pointer;text-align:center;transition:transform .15s}
.game:hover{transform:translateY(-4px) rotate(-1deg)}
.game.on{outline:5px solid var(--pur);outline-offset:3px}
.game .ic{font-size:3.4rem}
.game h3{margin:.2em 0}.game p{margin:0;color:var(--mut);font-size:.95rem}
.tag{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;border:2px solid var(--line);color:#2b2350}
.live{background:var(--grn)}.soon{background:var(--yel)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}.row .btn{flex:0 0 auto}
.room{display:grid;grid-template-columns:1fr 310px;gap:16px}
@media(max-width:820px){.room{grid-template-columns:1fr}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.code{font-size:1.5rem;letter-spacing:6px;font-weight:700;background:var(--yel);color:#2b2350;border:3px dashed var(--line);border-radius:14px;padding:2px 14px}
canvas{width:100%;aspect-ratio:4/3;background:#fff;border:3px solid var(--line);border-radius:18px;touch-action:none;cursor:crosshair;display:block}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{transform:scale(1.25)}
.word{text-align:center;font-size:1.6rem;font-weight:700;letter-spacing:5px;margin:0 0 10px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dotted var(--mut)}
.pl:last-child{border:0}.pl .e{font-size:1.6rem}.pl .n{flex:1;font-weight:600}.pl .sc{font-weight:700;color:var(--pur)}
.chat{height:200px;overflow:auto;background:var(--bg);border-radius:14px;padding:8px;margin:8px 0;font-size:.95rem}
.chat div{margin:3px 0;word-break:break-word}.chat .sys{color:var(--grn);font-weight:700}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}.modal .card{max-width:460px;max-height:80vh;overflow:auto}
.modal li{margin:6px 0}
.hide{display:none!important}
body{background:#2559d6;background-image:radial-gradient(#ffffff22 2px,transparent 2px),radial-gradient(#ffffff14 3px,transparent 3px);background-size:34px 34px,58px 58px;background-position:0 0,17px 17px}
.sub{color:#e6eeff}h1{-webkit-text-stroke:2px #2b2350;paint-order:stroke fill;text-shadow:0 5px 0 #2b2350}
.pa{width:1.6em;height:1.6em;vertical-align:middle}#bigav .pa{width:150px;height:150px}
.creator{display:grid;grid-template-columns:64px 160px 64px;justify-content:center;align-items:center;gap:10px;position:relative;margin:10px 0;padding:12px;border-radius:18px;background:#2559d633}
.creator #dice{position:absolute;top:6px;right:6px}.col{display:flex;flex-direction:column;gap:18px}
.arr{border:3px solid var(--line);background:var(--yel);border-radius:10px;font-size:1.2rem;padding:6px;cursor:pointer;color:#2b2350;box-shadow:0 3px 0 var(--line)}.arr:active{transform:translateY(2px)}
.room{grid-template-columns:200px 1fr 290px}.room>div:last-child{display:contents}
.room>div:last-child>.card:first-child{grid-column:1;grid-row:1;align-self:start}.room>#stage{grid-column:2;grid-row:1}.room>div:last-child>.card:last-child{grid-column:3;grid-row:1;align-self:start}
@media(max-width:900px){.room{grid-template-columns:1fr}.room>#stage,.room>div:last-child>.card{grid-column:1!important;grid-row:auto!important}}
.chat{height:340px}.pl b{color:var(--mut)}.pl .sc{font-size:.8rem}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.clk{width:52px;height:52px;border-radius:50%;border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;background:var(--yel);color:#2b2350}
.hint{flex:1;text-align:center;font-weight:700;font-size:.8rem;color:var(--mut)}.hint span{font-size:1.7rem;letter-spacing:5px;color:var(--ink)}
.lobby{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}select{border:3px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);font:inherit;color:inherit}
.sz{width:34px;height:34px;border-radius:10px;border:3px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.sz i{background:var(--ink);border-radius:50%;display:block}.sz.on{background:var(--yel)}
.felt{background:radial-gradient(circle at 50% 45%,#ff9f43,#e0392b 62%,#8e1a14);border-radius:20px;padding:14px;min-height:520px;display:flex;flex-direction:column;justify-content:space-between}
.opps{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.op{text-align:center;color:#fff;font-weight:600;padding:4px 8px}.op small{display:block}
.fanh{display:flex;justify-content:center;padding:8px 0}.fanh .uc{margin-left:-22px;flex:none}.fanh .uc:first-child{margin-left:0}.op .uc{width:34px;height:50px;font-size:.6rem}
.fanh.me{margin-top:8px;overflow-x:auto;padding-top:20px;position:relative}.fanh.me .uc:not(.no):hover{transform:translateY(-18px)}.you{position:absolute;left:0;top:0;color:#fff;font-weight:700}
.uc{position:relative;transition:transform .12s}.uc i{font-style:normal;background:#fff;color:#2b2350;border-radius:50%;width:72%;padding:8px 0;text-align:center;transform:rotate(-20deg)}.uc.y i{color:#b58900}
.uc.cb{background:#1d1838}.uc.cb i{background:#ff5c6c;color:#ffc928;font-size:.8em;padding:6px 0}.uc.big i{font-size:1.2rem;padding:12px 0}
.mid{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0}.ring{font-size:3rem;color:#fff;opacity:.8}.msg.w{color:#fff;text-shadow:0 2px 0 #0006}
.pulse{animation:pu .8s infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.3)}}
</style></head><body>
<div class="wrap">

<section id="home">
  <h1 id="title"></h1>
  <p class="sub">Pick a game, grab a room code, and play with your friends!</p>
  <div class="card">
    <b>1 · Make your character</b>
    <div class="row" style="margin-top:8px"><input id="nick" maxlength="14" placeholder="Your nickname"></div>
    <div class="creator"><button class="btn s" id="dice" title="Random">🎲</button><div class="col" id="la"></div><div id="bigav"></div><div class="col" id="ra"></div></div>
  </div>
  <div class="games" id="games"></div>
  <div class="card">
    <b>3 · Start or join a room</b>
    <div class="row" style="margin-top:10px">
      <button class="btn g" id="create">✨ Create room</button>
      <input id="joincode" maxlength="4" placeholder="CODE" style="text-transform:uppercase;letter-spacing:5px;text-align:center">
      <button class="btn b" id="join">Join</button>
    </div>
    <p id="err" style="color:var(--red);margin:8px 0 0"></p>
  </div>
</section>

<section id="roomv" class="hide">
  <div class="bar">
    <div class="row" style="flex:0"><button class="btn s" id="leave">← Leave</button><span class="code" id="rcode"></span><b id="gname"></b></div>
    <div class="row" style="flex:0"><button class="btn s b" id="rules">📖 Rules</button><button class="btn s" id="mute">🔊</button></div>
  </div>
  <div class="room">
    <div class="card" id="stage"></div>
    <div>
      <div class="card"><b>🏆 Scoreboard</b><div id="plist"></div></div>
      <div class="card" style="margin-top:14px"><b>💬 Chat</b><div class="chat" id="chat"></div>
        <div class="row"><input id="msg" maxlength="80" placeholder="Type a message…"><button class="btn s g" id="send">Send</button></div></div>
    </div>
  </div>
</section>
</div>

<div class="modal" id="modal"><div class="card"><h2 id="mt" style="margin-top:0"></h2><div id="mb"></div><p><button class="btn g" id="mx">Got it!</button></p></div></div>

<script>
(function(){const proto=location.protocol==='https:'?'wss':'ws';
window.claude={use:async n=>n!=='room'?null:{join:code=>new Promise((res,rej)=>{
 const ws=new WebSocket(proto+'://'+location.host),hs={},pc=[];let me=null,peers=[];
 const R={emit:async(t,d)=>ws.send(JSON.stringify({t:'emit',topic:t,data:d})),
  on:(t,f)=>{(hs[t]=hs[t]||[]).push(f);return()=>{}},
  presence:async p=>ws.send(JSON.stringify({t:'pres',patch:p})),
  onPeers:f=>{pc.push(f);f({peers,joined:peers,left:[],updated:[]});return()=>{}}};
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:code}));
 ws.onerror=()=>rej(new Error('connect'));
 ws.onclose=()=>{if(window.say)say('sys','\u26a0\ufe0f Disconnected \u2013 reload the page to rejoin')};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='welcome'){me=m.peer;res(R)}
  else if(m.t==='msg')(hs[m.topic]||[]).forEach(f=>f({data:m.data,peer:m.peer,isMe:m.peer===me}));
  else if(m.t==='peers'){const old=peers.map(p=>p.peer);peers=m.list.map(p=>({peer:p.peer,presence:p.presence,isMe:p.peer===me}));
   const joined=peers.filter(p=>!old.includes(p.peer));pc.forEach(f=>f({peers,joined,left:[],updated:[]}))}};
})}}})();
</script>
<script>
const GAMES={
 pictionary:{n:'Pictionary',ic:'🎨',d:'Draw it, guess it!',live:1,rules:['Take turns being the drawer – click “I’ll draw!”.','The drawer gets a secret word and sketches it. No letters or numbers!','Everyone else guesses by typing in the chat.','First correct guess scores 100 points, the drawer earns 50.']},
 uno:{n:'Uno',ic:'🃏',d:'Match colors and numbers, shout UNO!',live:1,rules:['Each player starts with 7 cards.','Match the top card by color or number.','Action cards: Skip, Reverse, Draw 2, Wild, Wild Draw 4.','Say “UNO” with one card left. First to empty their hand wins.']},
 ludo:{n:'Ludo',ic:'🎲',d:'Race your 4 tokens home!',live:1,rules:['Roll a 6 to bring a token out of your yard.','Move tokens clockwise by the number rolled.','Land on an opponent to send them home (not on safe stars).','Get all 4 tokens to the center to win. A 6 gives you another roll!']}
};
const EM=['🦊','🐼','🐸','🦄','🐙','🐯','🐵','🦖','🐰','🐧','🦁','🐳'];
const WORDS=['pizza','rocket','banana','guitar','elephant','castle','umbrella','robot','volcano','butterfly','snowman','bicycle','dragon','cupcake','lighthouse','octopus','pirate','sunflower','airplane','ice cream'];
const COLORS=['#000000','#ffffff','#ff5c6c','#ff9a3c','#ffc928','#8be04e','#2ecc8f','#33c6ee','#4c8dff','#8a5cff','#ff7ac8','#8b5a2b'];
const $=id=>document.getElementById(id);
const S={size:6,dt:80,av:'0.0.0',game:'pictionary',room:null,code:'',peers:[],me:null,word:null,drawer:null,wlen:0,color:COLORS[0],muted:false,score:0};
let ctx;
// title
$('title').innerHTML=[...'Party Palace'].map(c=>c===' '?' ':'<span>'+c+'</span>').join('');
// avatars
const EYES=['<circle cx="14" cy="17" r="3"/><circle cx="26" cy="17" r="3"/>','<circle cx="14" cy="17" r="4.5" fill="#fff" stroke="#000"/><circle cx="26" cy="17" r="4.5" fill="#fff" stroke="#000"/><circle cx="14" cy="17" r="2"/><circle cx="26" cy="17" r="2"/>','<path d="M10 18q4-6 8 0M22 18q4-6 8 0" fill="none" stroke="#000" stroke-width="2"/>','<path d="M11 14l6 6m0-6l-6 6M23 14l6 6m0-6l-6 6" stroke="#000" stroke-width="2"/>','<path d="M10 17h8M22 17h8" stroke="#000" stroke-width="2.5"/>'];
const MOUTH=['<path d="M12 27q8 7 16 0" fill="none" stroke="#000" stroke-width="2"/>','<ellipse cx="20" cy="29" rx="5" ry="4"/>','<path d="M13 29h14" stroke="#000" stroke-width="2.5"/>','<path d="M12 27q8 7 16 0z" fill="#fff" stroke="#000" stroke-width="2"/><path d="M17 31q3 5 6 0" fill="#ff5c6c"/>','<path d="M12 32q8-7 16 0" fill="none" stroke="#000" stroke-width="2"/>'];
const BODY=['#ff5c6c','#ffa030','#ffc928','#2ecc8f','#33c6ee','#4c8dff','#8a5cff','#ff7ac8'];
function A(c){const m=/^(\d)\.(\d)\.(\d)$/.exec(c||'')||['','0','0','0'];return `<svg class="pa" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${BODY[m[3]%8]}" stroke="#000" stroke-width="2"/>${EYES[m[1]%5]}${MOUTH[m[2]%5]}</svg>`}
const CR=[0,0,0],LEN=[5,5,8];
function drawBig(){S.av=CR.join('.');$('bigav').innerHTML=A(S.av)}
[0,1,2].forEach(r=>[['la','\u25c0',-1],['ra','\u25b6',1]].forEach(([id,t,d])=>{const b=document.createElement('button');b.className='arr';b.textContent=t;b.title=['Eyes','Mouth','Color'][r];b.onclick=()=>{CR[r]=(CR[r]+d+LEN[r])%LEN[r];drawBig();beep(500+r*120,.05)};$(id).append(b)}));
$('dice').onclick=()=>{LEN.forEach((n,i)=>CR[i]=Math.random()*n|0);drawBig();beep(700,.08)};drawBig();
// game cards
function drawCards(){$('games').innerHTML='';for(const k in GAMES){const g=GAMES[k],d=document.createElement('div');d.className='card game'+(k===S.game?' on':'');d.innerHTML=`<div class="ic">${g.ic}</div><h3>${g.n}</h3><p>${g.d}</p><span class="tag ${g.live?'live':'soon'}">${g.live?'Playable':'Lobby only · coming soon'}</span>`;d.onclick=()=>{S.game=k;drawCards()};d.querySelector('h3').insertAdjacentHTML('beforebegin','');$('games').append(d)}}
drawCards();
// sound
let ac;function beep(f=660,t=.12,type='triangle'){if(S.muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+t)}catch(e){}}
const cheer=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*110));
$('mute').onclick=()=>{S.muted=!S.muted;$('mute').textContent=S.muted?'🔇':'🔊'};
// modal
function showRules(k){const g=GAMES[k];$('mt').textContent=g.ic+' '+g.n+' rules';$('mb').innerHTML='<ol>'+g.rules.map(r=>'<li>'+r+'</li>').join('')+'</ol>';$('modal').classList.add('show')}
$('mx').onclick=()=>$('modal').classList.remove('show');
$('rules').onclick=()=>showRules(S.game);
// rooms
const rnd=()=>[...Array(4)].map(()=>'abcdefghjkmnpqrstuvwxyz'[Math.random()*23|0]).join('');
async function enter(code){
  $('err').textContent='';
  let base;try{base=await claude.use('room')}catch(e){}
  if(!base){$('err').textContent='Could not connect to the game server. Please try again.';return}
  try{S.room=await base.join('pp-'+code)}catch(e){$('err').textContent='Could not join that room. Try again.';return}
  S.code=code;$('home').classList.add('hide');$('roomv').classList.remove('hide');
  $('rcode').textContent=code.toUpperCase();$('gname').textContent=GAMES[S.game].ic+' '+GAMES[S.game].n;
  const r=S.room;
  await r.presence({name:($('nick').value.trim()||'Player'),av:S.av,score:0,game:S.game});
  r.onPeers(c=>{S.peers=[...c.peers];S.me=S.peers.find(p=>p.isMe)||S.me;
    c.joined.forEach(p=>{if(!p.isMe)say('sys',A(p.presence.av)+' '+esc(p.presence.name||'Someone')+' joined!')});renderPeers();
    const host=S.peers.find(p=>!p.isMe&&p.presence.game);if(host&&!S.gameSynced){S.gameSynced=1;S.game=host.presence.game;$('gname').textContent=GAMES[S.game].ic+' '+GAMES[S.game].n;buildStage()}});
  r.on('chat',m=>{say('',A(m.data.av)+' <b>'+esc(m.data.n)+'</b>: '+esc(m.data.t));beep(880,.05);
    if(S.drawer&&S.me&&S.drawer===S.me.peer&&S.word&&m.data.t.trim().toLowerCase()===S.word&&!m.isMe)r.emit('correct',{peer:m.peer,n:m.data.n,w:S.word})});
  r.on('round',m=>{S.drawer=m.peer;S.wlen=m.data.len;S.endAt=Date.now()+(m.data.dt||80)*1000;S.rn=(S.rn||0)+1;S.word=m.isMe?S.word:null;S.solved=false;clearCv();buildStage();say('sys',esc(m.data.n||'Someone')+' is drawing!');beep(520)});
  r.on('stroke',m=>{if(!m.isMe)seg(m.data)});
  r.on('clear',m=>{if(!m.isMe)clearCv()});
  r.on('timeup',m=>{say('sys','⏰ Time up! The word was '+esc(m.data.w||'?'));S.drawer=null;S.word=null;S.endAt=0;S.solved=true;buildStage()});
  r.on('act',m=>{if(!isHost())return;const a=m.data,g=S.gs;if(a.t==='sync'){if(g)pub();return}
    if(a.t==='start'){S.gs=S.game==='uno'?unoNew():ludoNew();pub();return}
    if(!g||g.win||g.pl[g.t]!==m.peer)return;(g.g==='uno'?unoAct:ludoAct)(g,a);pub()});
  r.on('state',m=>{S.gs=m.data;buildStage();paid();beep(600,.06)});
  setTimeout(()=>r.emit('act',{t:'sync'}),900);
  r.on('correct',m=>{if(S.solved)return;S.solved=true;say('sys','🎉 '+esc(m.data.n)+' guessed it: '+esc(m.data.w)+'!');cheer();
    if(S.me&&m.data.peer===S.me.peer)bump(100);else if(S.me&&S.drawer===S.me.peer)bump(50);S.drawer=null;S.word=null;S.endAt=0;buildStage()});
  buildStage();say('sys','Welcome! Share code '+code.toUpperCase()+' with friends.');
}
async function bump(n){S.score+=n;await S.room.presence({score:S.score})}
$('create').onclick=()=>enter(rnd());
$('join').onclick=()=>{const c=$('joincode').value.trim().toLowerCase();if(c.length!==4){$('err').textContent='Enter the 4-letter code.';return}enter(c)};
$('leave').onclick=()=>location.reload();
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function say(cls,h){const d=document.createElement('div');d.className=cls;d.innerHTML=h;$('chat').append(d);$('chat').scrollTop=1e9}
function renderPeers(){const ps=[...S.peers].sort((a,b)=>(b.presence.score||0)-(a.presence.score||0));
  $('plist').innerHTML=ps.map((p,i)=>`<div class="pl"><b>#${i+1}</b><span class="e">${A(p.presence.av)}</span><span class="n">${esc(p.presence.name||'Player')}${p.isMe?' (you)':''}${S.drawer===p.peer?' ✏️':''}</span><span class="sc">${p.presence.score||0} pts</span></div>`).join('')}
function sendChat(){const t=$('msg').value.trim();if(!t||!S.room)return;$('msg').value='';
  S.room.emit('chat',{t,n:$('nick').value.trim()||'Player',av:S.av});}
$('send').onclick=sendChat;$('msg').onkeydown=e=>{if(e.key==='Enter')sendChat()};
// stage
function buildStage(){renderPeers();const st=$('stage');if(S.game!=='pictionary')return cardGame(st);
  const iDraw=S.me&&S.drawer===S.me.peer,hint=iDraw?esc(S.word||''):S.drawer?'_ '.repeat(S.wlen).trim():'';
  st.innerHTML=`<div class="top"><div class="clk" id="clk">${S.drawer?Math.max(0,Math.ceil((S.endAt-Date.now())/1000)):S.dt}</div><b>Round ${S.rn||1}</b><div class="hint">${iDraw?'DRAW THIS':S.drawer?'GUESS THIS':'WAITING'}<br><span>${hint}</span></div></div>
  <canvas id="cv" width="800" height="600"></canvas>
  ${S.drawer?'':`<div class="lobby"><b>\u23f1 Draw time</b> <select id="dt">${[30,60,80,120].map(n=>`<option${n===S.dt?' selected':''}>${n}</option>`).join('')}</select> <button class="btn g" id="go">\U0001F58D\ufe0f I\u2019ll draw!</button></div>`}
  ${iDraw?`<div class="tools">${COLORS.map(c=>`<button class="sw${c===S.color?' on':''}" style="background:${c}" data-c="${c}"></button>`).join('')}${[3,6,12,20].map(z=>`<button class="sz${z===S.size?' on':''}" data-z="${z}"><i style="width:${z}px;height:${z}px"></i></button>`).join('')}<button class="btn s" id="clr">\U0001F9FD Clear</button></div>`:''}`;
  ctx=$('cv').getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  if(iDraw)bindDraw();
  const dt=$('dt');if(dt)dt.onchange=()=>S.dt=+dt.value;
  const go=$('go');if(go)go.onclick=()=>{S.word=WORDS[Math.random()*WORDS.length|0];S.room.emit('round',{len:S.word.length,n:$('nick').value.trim()||'Player',dt:S.dt})};
  st.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{S.color=b.dataset.c;st.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))});
  st.querySelectorAll('.sz').forEach(b=>b.onclick=()=>{S.size=+b.dataset.z;st.querySelectorAll('.sz').forEach(x=>x.classList.toggle('on',x===b))});
  const c=$('clr');if(c)c.onclick=()=>{clearCv();S.room.emit('clear',{})};
}
setInterval(()=>{const k=$('clk');if(S.drawer&&S.endAt){const t=Math.max(0,Math.ceil((S.endAt-Date.now())/1000));if(k)k.textContent=t;
  if(!t&&S.me&&S.drawer===S.me.peer&&S.word){const w=S.word;S.endAt=0;S.room.emit('timeup',{w})}}},500);
function clearCv(){if(ctx)ctx.clearRect(0,0,800,600)}
function seg(d){if(!ctx)return;ctx.strokeStyle=d.c;ctx.lineWidth=d.w;ctx.beginPath();ctx.moveTo(d.x0*800,d.y0*600);ctx.lineTo(d.x1*800,d.y1*600);ctx.stroke()}
function bindDraw(){const cv=$('cv');let last=null,buf=[],t=0;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);last=pt(e)};
  cv.onpointermove=e=>{if(!last)return;const p=pt(e),d={x0:last[0],y0:last[1],x1:p[0],y1:p[1],c:S.color,w:S.size*(S.color==='#ffffff'?3:1)};seg(d);S.room.emit('stroke',d);last=p};
  cv.onpointerup=cv.onpointercancel=()=>{last=null}}
document.head.insertAdjacentHTML('beforeend','<style>.hand{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;justify-content:center}.uc{width:54px;height:78px;border-radius:10px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line)}.uc.r{background:#ff5c6c}.uc.y{background:#ffc928;color:#2b2350}.uc.g{background:#2ecc8f}.uc.b{background:#4c8dff}.uc.k{background:#2b2350}.uc.no{opacity:.4;cursor:default}.uc.big{width:76px;height:108px;font-size:2rem;cursor:default}.turn{outline:3px solid var(--pur);border-radius:10px}.opp{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:600}.opp span{padding:2px 8px}.msg{text-align:center;font-weight:700;margin:8px 0}</style>');
const hostP=()=>S.peers.map(p=>p.peer).sort()[0],isHost=()=>S.me&&S.me.peer===hostP(),pub=()=>S.room.emit('state',S.gs);
const nm=id=>{const p=S.peers.find(x=>x.peer===id);return p?A(p.presence.av)+' '+esc(p.presence.name||'Player'):'Player'};
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function paid(){const g=S.gs;if(g&&g.win&&S.me&&g.win===S.me.peer&&S.paid!==g.id){S.paid=g.id;bump(100);cheer()}}
function cardGame(st){renderPeers();const g=S.gs;
  if(!g||g.g!==S.game){st.innerHTML=`<div style="text-align:center;padding:30px"><div style="font-size:4rem">${GAMES[S.game].ic}</div><h2>${GAMES[S.game].n}</h2><p>${S.peers.length} player(s) here (max ${S.game==='uno'?6:4}). Wait for friends, then start!</p><button class="btn g" id="st">▶ Start game</button> <button class="btn b" onclick="showRules(S.game)">📖 Rules</button></div>`;$('st').onclick=()=>S.room.emit('act',{t:'start'});return}
  S.game==='uno'?unoUI(g,st):ludoUI(g,st)}
function again(g){return g.win?`<p class="msg">🏆 ${nm(g.win)} wins!</p><p style="text-align:center"><button class="btn g" id="st">Play again</button></p>`:''}
// ---- UNO
const udeck=()=>{const d=[];for(const c of 'rygb'){d.push(c+'0');for(const v of '123456789SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('kW','kF');return sh(d)};
const ubad=c=>c[0]==='k'||'SRD'.includes(c[1]);
function unoNew(){const d=udeck(),pl=S.peers.map(p=>p.peer).sort().slice(0,6),h={};pl.forEach(p=>h[p]=d.splice(0,7));let top;do{top=d.shift();if(ubad(top))d.push(top)}while(ubad(top));return{g:'uno',id:Math.random(),pl,h,d,top,col:top[0],t:0,dir:1,win:null,msg:'Game on!'}}
function udraw(g,p,n){for(let i=0;i<n;i++){if(!g.d.length)g.d=udeck();g.h[p].push(g.d.shift())}}
function unoAct(g,a){const p=g.pl[g.t],n=g.pl.length,nx=()=>(g.t+g.dir+n)%n;
  if(a.t==='draw'){udraw(g,p,1);g.msg=nm(p)+' drew a card';g.t=nx();return}
  if(a.t!=='play')return;const c=g.h[p][a.i];if(!c||!(c[0]==='k'||c[0]===g.col||c[1]===g.top[1]))return;
  g.h[p].splice(a.i,1);g.top=c;g.col=c[0]==='k'?(a.col||'r'):c[0];g.msg=nm(p)+' played a card';
  if(!g.h[p].length){g.win=p;return}
  const v=c[1];if(v==='R'){g.dir*=-1;if(n===2)return}else if(v==='S')g.t=nx();else if(v==='D'){g.t=nx();udraw(g,g.pl[g.t],2)}else if(v==='F'){g.t=nx();udraw(g,g.pl[g.t],4)}
  g.t=nx()}
const ulab=c=>({S:'\u2298',R:'\u21c4',D:'+2',W:'\u2605',F:'+4'}[c[1]]||c[1]);
function unoUI(g,st){const me=S.me.peer,mine=g.h[me],my=g.pl[g.t]===me&&!g.win,others=g.pl.filter(p=>p!==me),ok=c=>my&&(c[0]==='k'||c[0]===g.col||c[1]===g.top[1]);
  st.innerHTML=`<div class="felt"><div class="opps">${others.map(p=>`<div class="op ${g.pl[g.t]===p?'turn':''}">${nm(p)}<div class="fanh">${g.h[p].slice(0,12).map(()=>'<div class="uc cb"><i>UNO</i></div>').join('')}</div><small>${g.h[p].length} cards</small></div>`).join('')||'<p class="msg w">Waiting for opponents\u2026</p>'}</div>
  <div class="mid"><div class="dk" id="dr" style="${my?'cursor:pointer;outline:4px solid #fff;border-radius:12px':''}"><div class="uc cb big"><i>UNO</i></div></div><div class="uc big ${g.col}"><i>${ulab(g.top)}</i></div><div class="ring">${g.dir>0?'\u21bb':'\u21ba'}</div></div>
  <p class="msg w">${g.msg} \u00b7 ${g.win?'':my?'Your turn! Play a card or tap the pile':'Turn: '+nm(g.pl[g.t])}</p>${again(g)}
  ${S.pend!=null?'<p class="msg w">Pick a color:</p><div class="hand">'+'rygb'.split('').map(c=>`<div class="uc ${c}" data-col="${c}"><i>\u25cf</i></div>`).join('')+'</div>':''}
  ${mine?`<div class="fanh me"><div class="you">YOU</div>${mine.map((c,i)=>`<div class="uc ${c[0]} ${ok(c)?'':'no'}" data-i="${i}"><i>${ulab(c)}</i></div>`).join('')}</div>`:'<p class="msg w">\U0001F440 Spectating</p>'}</div>`;
  const s=$('st');if(s)s.onclick=()=>S.room.emit('act',{t:'start'});
  const d=$('dr');if(d&&my)d.onclick=()=>{S.pend=null;S.room.emit('act',{t:'draw'})};
  st.querySelectorAll('[data-i]:not(.no)').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(mine[i][0]==='k'){S.pend=i;unoUI(g,st)}else{S.pend=null;S.room.emit('act',{t:'play',i})}});
  st.querySelectorAll('[data-col]').forEach(e=>e.onclick=()=>{S.room.emit('act',{t:'play',i:S.pend,col:e.dataset.col});S.pend=null})}
// ---- LUDO
const LS=[0,13,26,39],LC=['#ff5c6c','#2ecc8f','#ffc928','#4c8dff'],SAFE=[0,8,13,21,26,34,39,47];
function ludoNew(){const pl=S.peers.map(p=>p.peer).sort().slice(0,4),tok={};pl.forEach(p=>tok[p]=[-1,-1,-1,-1]);return{g:'ludo',id:Math.random(),pl,tok,t:0,roll:null,win:null,msg:'Roll the dice!'}}
const lab=(i,s)=>(LS[i]+s)%52;
function lmoves(g,p){const r=g.roll;return g.tok[p].map((s,k)=>s<0?(r===6?k:-1):(s+r<=56?k:-1)).filter(k=>k>=0)}
function ludoAct(g,a){const p=g.pl[g.t],adv=()=>{g.t=(g.t+1)%g.pl.length;g.roll=null};
  if(a.t==='roll'&&g.roll===null){g.roll=1+Math.random()*6|0;g.msg=nm(p)+' rolled a '+g.roll;if(!lmoves(g,p).length){g.msg+=' – no move';adv()}return}
  if(a.t==='move'&&g.roll!==null&&lmoves(g,p).includes(a.k)){const T=g.tok[p],s=T[a.k];T[a.k]=s<0?0:s+g.roll;
    if(T[a.k]<=50){const c=lab(g.t,T[a.k]);if(!SAFE.includes(c))g.pl.forEach((q,j)=>{if(q!==p)g.tok[q]=g.tok[q].map(x=>x>=0&&x<=50&&lab(j,x)===c?-1:x)})}
    if(T.every(x=>x===56)){g.win=p;return}
    if(g.roll===6)g.roll=null;else adv()}}
const RING=(()=>{const r=[],a=(x,y)=>r.push([x,y]);for(let x=1;x<=5;x++)a(x,6);for(let y=5;y>=0;y--)a(6,y);a(7,0);for(let y=0;y<=5;y++)a(8,y);for(let x=9;x<=14;x++)a(x,6);a(14,7);a(14,8);for(let x=13;x>=9;x--)a(x,8);for(let y=9;y<=14;y++)a(8,y);a(7,14);a(6,14);for(let y=13;y>=9;y--)a(6,y);for(let x=5;x>=0;x--)a(x,8);a(0,7);a(0,6);return r})();
const HC=[s=>[1+s,7],s=>[7,1+s],s=>[13-s,7],s=>[7,13-s]],YO=[[0,0],[9,0],[9,9],[0,9]],CN=['red','green','yellow','blue'];
function ludoUI(g,st){const me=S.me.peer,my=g.pl[g.t]===me&&!g.win,mv=my&&g.roll!==null?lmoves(g,me):[],ci=g.pl.indexOf(me);
  const yd=(i,k)=>[YO[i][0]+1.9+(k%2)*2.2,YO[i][1]+1.9+(k>>1)*2.2];
  const tp=(i,s,k)=>s<0?yd(i,k):s<=50?RING[(LS[i]+s)%52].map(v=>v+.5):s<56?HC[i](s-51).map(v=>v+.5):[7.5+[-.6,0,.6,0][i]+(k-1.5)*.1,7.5+[0,-.6,0,.6][i]];
  let sv='';
  LC.forEach((c,i)=>{sv+=`<rect x="${YO[i][0]}" y="${YO[i][1]}" width="6" height="6" fill="${c}"/><rect x="${YO[i][0]+1}" y="${YO[i][1]+1}" width="4" height="4" rx=".5" fill="#fff"/>`;for(let k=0;k<4;k++){const[x,y]=yd(i,k);sv+=`<circle cx="${x}" cy="${y}" r=".5" fill="${c}" opacity=".3"/>`}});
  RING.forEach(([x,y],c)=>{const si=LS.indexOf(c);sv+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${si>=0?LC[si]:'#fff'}" stroke="#555" stroke-width=".05"/>`+(SAFE.includes(c)&&si<0?`<text x="${x+.5}" y="${y+.78}" font-size=".8" text-anchor="middle" fill="#999">\u2605</text>`:'')});
  LC.forEach((c,i)=>{for(let s=0;s<5;s++){const[x,y]=HC[i](s);sv+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}" stroke="#555" stroke-width=".05"/>`}});
  sv+=`<polygon points="6,6 6,9 7.5,7.5" fill="${LC[0]}"/><polygon points="6,6 9,6 7.5,7.5" fill="${LC[1]}"/><polygon points="9,6 9,9 7.5,7.5" fill="${LC[2]}"/><polygon points="6,9 9,9 7.5,7.5" fill="${LC[3]}"/>`;
  g.pl.forEach((p,i)=>g.tok[p].forEach((s,k)=>{const[x,y]=tp(i,s,k),can=p===me&&mv.includes(k);sv+=`<g ${can?`class="pulse" data-k="${k}" style="cursor:pointer"`:''}><circle cx="${x}" cy="${y}" r="${can?.44:.38}" fill="${LC[i]}" stroke="#2b2350" stroke-width="${can?.16:.1}"/><circle cx="${x-.12}" cy="${y-.12}" r=".1" fill="#fff" opacity=".75"/></g>`}));
  st.innerHTML=`<div class="opp" style="margin-bottom:8px">${g.pl.map((p,i)=>`<span class="${g.pl[g.t]===p?'turn':''}" style="background:${LC[i]};border-radius:99px;color:#2b2350;padding:2px 10px">${nm(p)}</span>`).join('')}</div>
  <svg viewBox="-.15 -.15 15.3 15.3" style="width:100%;max-width:600px;display:block;margin:auto;background:#fff;border:3px solid #2b2350;border-radius:14px">${sv}</svg>
  <p class="msg">${g.msg}${g.roll?' \u00b7 pick a glowing token':''} ${g.win?'':'\u00b7 Turn: '+nm(g.pl[g.t])}</p>${again(g)}
  <p style="text-align:center">${ci<0?'\U0001F440 Spectating':my&&g.roll===null?'<button class="btn g" id="rl">\U0001F3B2 Roll</button>':''} <span style="color:var(--mut)">${ci>=0?'You are '+CN[ci]:''}</span> ${g.roll?`<span style="font-size:2.4rem;vertical-align:middle">${'\u2680\u2681\u2682\u2683\u2684\u2685'[g.roll-1]}</span>`:''}</p>`;
  const s=$('st');if(s)s.onclick=()=>S.room.emit('act',{t:'start'});
  const r=$('rl');if(r)r.onclick=()=>S.room.emit('act',{t:'roll'});
  st.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>S.room.emit('act',{t:'move',k:+e.dataset.k}))}
</script></body></html>
